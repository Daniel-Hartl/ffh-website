<!DOCTYPE html>
<html lang="de">

<head>
    <link type="image/png" rel="icon" href="images/favicon.png">
    <meta charset="UTF-8" />
    <script src="scripts/generator scripts/loadMetadata.js"></script>
    <script src="scripts/generator scripts/loadComponent.js"></script>
    <script src="scripts/generator scripts/loadAppointments.js"></script>
    <script src="scripts/component logic/calendarEmbed.js"></script>
    <script src="scripts/googleConsent.js"></script>
    <link href="styles/defaults/buttons.css" rel="stylesheet">
    <link href="styles/defaults/aligns.css" rel="stylesheet">
    <link href="styles/defaults/margins.css" rel="stylesheet">
    <link href="styles/pages/termin.css" rel="stylesheet">
</head>

<body>
    <header class="dynamic-content" src="header/header.html"></header>
    <main>
        <h1>Kalender</h1>
        <div class="calender thin-margin-bottom">
            <div id="placeholder" class="calendar">
                <div>
                    <p>Zum Anzeigen des Google Kalenders müssen zuerst die <a
                            href="https://policies.google.com/technologies/cookies?hl=en&utm_source=ucb">Google-Cookies</a>
                        akzeptiert werden.</p>
                    <button onclick="acceptCookies('streetView')"
                        class="primary-button center thin-margin-top">Google-Cookies akzeptieren</button>
                </div>
            </div>
        </div>
        <h1>Termine</h1>
        <div class="appointment-filter">
            <p class="caption">Zielgruppen:</p>
            <label><input type="radio" name="appointmentFilter" value="Alle" checked><span>Alle</span></label>
            <label><input type="radio" name="appointmentFilter" value="Verein"><span>Verein</span></label>
            <label><input type="radio" name="appointmentFilter" value="Aktive"><span>Aktive</span></label>
        </div>
        <table id="appointments" class="wide-margin-bottom center">
            <tr class="header">
                <td class="date">Zeit</td>
                <td class="location">Treffpunkt</td>
                <td class="description">Beschreibung</td>
                <td class="target">Zielgruppe</td>
            </tr>
        </table>
    </main>
    <footer class="dynamic-content" src="footer/footer.html"></footer>
</body>

</html>
